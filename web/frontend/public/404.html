<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChromaPeak Studio</title>
    <script type="text/javascript">
      // GitHub Pages / 静态托管 SPA 回退：把未知路径重写到 index.html
      var path = window.location.pathname;
      if (!path.endsWith('.html') && !path.endsWith('.js') && !path.endsWith('.css') && path.indexOf('/assets/') === -1) {
        sessionStorage.setItem('spa_redirect', path);
        window.location.replace(window.location.origin + window.location.pathname.split('/').slice(0, 1).join('/') + '/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
